<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ViralPro | Links</title>

    <meta name="description" content="ViralPro - Links oficiais">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #102b63 0%, #05070d 38%, #020308 100%);
            color: white;
            display: flex;
            justify-content: center;
            padding: 35px 18px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .logo {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #168cff, #0047ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -1px;
            box-shadow: 0 0 35px rgba(0, 120, 255, 0.45);
        }

        h1 {
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 7px;
        }

        .username {
            color: #8fa5c9;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .bio {
            color: #c9d3e5;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 auto 28px;
            max-width: 330px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;
            width: 100%;
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 15px;
            border: 1px solid rgba(75, 150, 255, 0.35);
            border-radius: 17px;
            background: rgba(13, 22, 39, 0.88);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: 0.2s ease;
        }

        .link:hover {
            transform: translateY(-2px);
            border-color: #168cff;
            background: rgba(20, 40, 70, 0.95);
            box-shadow: 0 10px 30px rgba(0, 110, 255, 0.22);
        }

        .link:active {
            transform: scale(0.98);
        }

        .main-link {
            background: linear-gradient(135deg, #087cff, #0051df);
            border-color: #168cff;
            box-shadow: 0 8px 30px rgba(0, 100, 255, 0.3);
        }

        .main-link:hover {
            background: linear-gradient(135deg, #1590ff, #0860f5);
        }

        .icon {
            position: absolute;
            left: 18px;
            font-size: 21px;
        }

        .footer {
            margin-top: 30px;
            color: #65748c;
            font-size: 12px;
        }

        .social {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social a {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 18px;
            transition: 0.2s;
        }

        .social a:hover {
            transform: translateY(-2px);
            border-color: #168cff;
        }
    </style>
</head>

<body>

    <main class="container">

            >
                <span class="icon">🛒</span>
                COMPRE PELO NOSSO SITE
            </a>

            <a
                class="link"
                href="https://instagram.com/viralpro01"
                target="_blank"

                <span class="icon">📸</span>
                INSTAGRAM
            </a>

            <a

        <div class="social">
            <a
                href="https://instagram.com/viralpro01"
                target="_blank"

                📸

</body>
</html>
