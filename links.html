<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ViralPro — Links Oficiais</title>
    <style>
        :root { --bg: #030508; --card: #080d16; --line: #121e30; --blue: #168cff; --blue-glow: #00d2ff; --text: #ffffff; --muted: #8ba2c0; }
        * { box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { margin: 0; background: radial-gradient(circle at 50% 0, #0a2540 0%, transparent 50%), var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--blue-glow); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); object-fit: cover; margin-bottom: 15px; }
        .username { font-size: 18px; font-style: italic; text-transform: uppercase; color: var(--text); margin-bottom: 30px; letter-spacing: -0.5px; }
        .links-wrapper { display: flex; flex-direction: column; gap: 16px; }
        .btn-link { display: block; padding: 18px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-weight: 900; text-transform: uppercase; font-style: italic; color: var(--text); text-decoration: none; transition: 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-link:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(22, 140, 255, 0.2); }
        .btn-link.featured { background: linear-gradient(135deg, var(--blue), #0056b3); border: none; box-shadow: 0 0 20px rgba(22, 140, 255, 0.4); }
        .btn-link.featured:hover { box-shadow: 0 0 30px rgba(0, 210, 255, 0.7); }
        footer { margin-top: 50px; font-family: sans-serif; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Oficial da ViralPro carregando direto -->
        <img class="profile-img" src="https://squarespace-cdn.com" alt="ViralPro Logo">
        <div class="username">@viralpro01</div>
        
        <div class="links-wrapper">
            <!-- Botão de Destaque para o seu Site Principal -->
            <a href="index.html" class="btn-link featured">🌐 ACESSAR SITE OFICIAL</a>
            
            <!-- Botão para o seu TikTok Oficial -->
            <a href="https://tiktok.com" target="_blank" class="btn-link">🎵 NOSSO TIKTOK OFICIAL</a>
            
            <!-- Botão Direto para o Atendimento no Chat do Insta -->
            <a href="https://ig.me" target="_blank" class="btn-link">✈️ CHAME NO DIRECT</a>
        </div>
        
        <footer>© 2026 ViralPro</footer>
    </div>
</body>
</html>
